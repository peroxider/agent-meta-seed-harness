[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "agent-meta-seed-harness"
version = "0.1.0.dev1"
description = "External deterministic Harness for the Agent Meta Runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["agent-meta-runtime==0.1.0.dev1", "cryptography>=43"]

[project.optional-dependencies]
scratch = ["ipykernel==7.4.0", "ipython==9.18.0", "jupyter-client==8.10.0"]
tokenizer-preparation = ["tokenizers==0.23.3"]

[project.scripts]
agent-meta-seed = "agent_meta_seed_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_meta_seed_harness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "package", ".github", "pyproject.toml", "requirements-ci.in", "requirements-ci.lock", "README.md", "CHANGELOG.md", "LICENSE", ".gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
